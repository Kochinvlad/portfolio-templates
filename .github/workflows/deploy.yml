name: Сборка и публикация на GitHub Pages

on:
  push:
    branches: [main]
  # Позволяет запустить публикацию вручную из вкладки Actions
  workflow_dispatch:

# Права, которые нужны действию deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно выполняется только одна публикация; лишние запуски отменяются
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      # До сборки: отсюда берётся полный адрес сайта для превью ссылок
      - name: Подготовить Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Собрать проект
        env:
          # Сайт лежит в подпапке с именем репозитория — передаём её в Vite
          VITE_BASE: /${{ github.event.repository.name }}/
          # Хеш коммита как версия сборки — по нему страница узнаёт об обновлении
          VITE_APP_VERSION: ${{ github.sha }}
          # Полный адрес сайта: мессенджеры берут картинку превью только по абсолютной ссылке
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: npm run build

      - name: Загрузить сборку
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
